<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Riley Wheel Brawl 2.0 - Stage 1: Emond's Field</title>
<style>
@font-face{font-family:'PressStart';src:url('assets/fonts/press-start-2p.ttf') format('truetype');font-display:block}
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#9fb0d0;font:14px/1.6 system-ui,sans-serif;pointer-events:none}
/* touch controls: only shown on touch devices (body.touch is set on the first real touch or a coarse pointer) */
#touch{position:fixed;inset:0;pointer-events:none;display:none}
body.touch #touch{display:block}
#stick{position:absolute;left:3vw;bottom:4vh;width:min(30vh,200px);height:min(30vh,200px);border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(15,22,40,.28);pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(200,215,255,.35);border:2px solid rgba(255,255,255,.4)}
.tb{position:absolute;width:min(14vh,92px);height:min(14vh,92px);border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,30,50,.38);color:#fff;font:bold 13px system-ui;display:flex;align-items:center;justify-content:center;pointer-events:auto;letter-spacing:.05em}
.tb.on{background:rgba(255,200,120,.45)}
#tbA{right:calc(4vw + min(15vh,100px));bottom:5vh;border-color:rgba(255,120,110,.7)}
#tbJ{right:3vw;bottom:calc(5vh + min(11vh,70px));border-color:rgba(120,180,255,.7)}
#tbS{right:calc(4vw + min(15vh,100px));bottom:calc(6vh + min(16vh,108px));border-color:rgba(120,230,255,.7)}
#tbP{right:3vw;top:3vh;width:52px;height:52px;font-size:16px}
</style></head><body>
<div id="game"></div>
<div id="boot">Loading Emond's Field…</div>
<div id="touch"><div id="stick"><div id="knob"></div></div>
<div class="tb" id="tbA">KICK</div><div class="tb" id="tbJ">JUMP</div><div class="tb" id="tbS">FIRE</div><div class="tb" id="tbP">II</div></div>
<script src="lib/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body></html>
