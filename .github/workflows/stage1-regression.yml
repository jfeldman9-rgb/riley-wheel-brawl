name: Stage 1 regression
on:
  pull_request:
    branches: [rwb-2]
  push:
    branches: [rwb-2-stage1-evidence]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: for f in src/*.js tools/*.mjs tests/*.mjs tests/helpers/*.mjs; do node --check "$f"; done
      - name: Combat, lifecycle, telemetry, and asset regressions
        run: node --test tests/*.test.mjs
      - name: Content ledger (open acceptance gaps stay visible)
        run: node tools/audit-stage1.mjs
      - name: Whitespace
        run: git diff --check
