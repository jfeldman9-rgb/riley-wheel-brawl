name: 1.1 acceptance
on:
  pull_request:
    branches: [rwb-w2]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: v11-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1 @napi-rs/canvas@0.1.100
      - name: All contracts, combat, saves, assets and balance
        run: |
          git worktree add --detach "$RUNNER_TEMP/rwb-old-parity" 7f3f94b
          git worktree add --detach "$RUNNER_TEMP/rwb-live-visual" 816eb1e9dc209b00a6da4f8eeb58ea2ead69bdbc
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node tools/ci-v11.cjs unit "$RUNNER_TEMP/rwb-old-parity" "$RUNNER_TEMP/rwb-live-visual"
      - name: Exact identity-pose and transformed-mesh comparisons
        if: always()
        run: |
          git worktree add --detach "$RUNNER_TEMP/rwb-pre-identity" ecb36da649796bffaacc1d698b0c824b63ce6fd7
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node tools/performance-idle-v11.cjs . "$RUNNER_TEMP/rwb-pre-identity"
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1 @napi-rs/canvas@0.1.100
          npx playwright install --with-deps chromium
      - name: Inherited regression and browser contracts
        id: regression
        if: always()
        run: node --expose-gc tools/check.cjs
      - name: Inherited release, cold entry and pacing
        id: release
        if: always()
        run: node --expose-gc tools/release-browser.cjs
      - name: Protected voice sequencing
        id: voice
        if: always()
        run: node --expose-gc tools/voice-sequence-check.cjs
      - name: Inherited audio browser checks
        id: audio
        if: always()
        run: node --expose-gc tools/audio-check.cjs
      - name: Inherited background seam scan
        id: seams
        if: always()
        run: node --expose-gc tools/joinscan.cjs
      - name: Independent audio mix checks
        id: mix
        if: always()
        run: node --expose-gc tools/audio/audio-mix-check.cjs
      - name: Phone, iPad and controller emulation
        id: devices
        if: always()
        run: node --expose-gc tools/v11-device-browser.cjs
      - name: Painted outcomes and enemy cards
        id: presentation
        if: always()
        run: node --expose-gc tools/presentation-browser-v11.cjs
      # Every test uses always(), so failures remain visible and later gates still run.
      - name: Report each browser gate honestly
        if: always()
        env:
          RESULTS: ${{ toJSON(steps) }}
        run: |
          node - <<'NODE'
          const steps=JSON.parse(process.env.RESULTS);
          const ids=['regression','release','voice','audio','seams','mix','devices','presentation'];
          let failed=false;
          for(const id of ids){const result=steps[id]?.outcome||'not run';console.log('RWB_BROWSER_GATE '+id+': '+result);if(result!=='success')failed=true;}
          process.exitCode=failed?1:0;
          NODE
      - name: Review screenshots in logs
        if: always()
        run: node tools/evidence-log-v11.cjs
  cold-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1 @napi-rs/canvas@0.1.100
          npx playwright install --with-deps chromium
      - name: Ten strict cold entries, music off and on
        run: node tools/performance-v11.cjs . docs/review/v11/ci-cold-smoke.json --cold-only
  matched-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1 @napi-rs/canvas@0.1.100
          npx playwright install --with-deps chromium
      - name: Three matched serial live-versus-candidate runs
        run: |
          git worktree add --detach "$RUNNER_TEMP/rwb-live-1.0" 816eb1e9dc209b00a6da4f8eeb58ea2ead69bdbc
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node tools/performance-compare-v11.cjs "$RUNNER_TEMP/rwb-live-1.0"
# Public-repository standard runners only. No secrets, caches, uploaded artifacts,
# paid services or deploy steps. Failures remain failures, including documented
# inherited behavioral contracts awaiting Jason/Grok review.
